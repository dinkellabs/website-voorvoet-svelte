name: CI

# Runs on every PR targeting main/dev so lint/format/type/unit-test
# regressions surface before merge. The post-merge push to main/dev is
# already validated by the PR run and would just re-run the same trees,
# so the `push` trigger is intentionally omitted. Release artefacts on
# merge are produced by docker-publish.yml.
#
# Playwright + Lighthouse are kept in dependent jobs so they only run after
# `ci` succeeds and skip on draft PRs to keep iteration cycle short.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency — VERSION file is the source of truth
        run: pnpm run version:check

      - name: Security lint — no $env/static/private or $env/dynamic/private outside server modules
        run: |
          # Fail if any non-server file imports from $env/*/private.
          # Allowed paths: src/lib/server/**, src/**/*.server.ts, src/**/+server.ts,
          # src/hooks.server.ts, src/**/__tests__/**
          bad=$(grep -rn --include="*.ts" --include="*.svelte" \
            'env/dynamic/private\|env/static/private' src/ \
            | grep -v '/server/' \
            | grep -v '\.server\.ts' \
            | grep -v '+server\.ts' \
            | grep -v 'hooks\.server\.ts' \
            | grep -v '/__tests__/' \
            || true)
          if [ -n "$bad" ]; then
            echo "ERROR: private env imported outside server context:"
            echo "$bad"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

  playwright:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app for E2E
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium-desktop
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# Lighthouse is intentionally not run in CI. Synthetic perf scores flap on
# shared GitHub-hosted runners, and a11y/SEO regressions worth gating on are
# already caught by lint/type/E2E. Run `make lighthouse` locally for an
# ad-hoc audit of the live site — see README.md "Lighthouse" section.
