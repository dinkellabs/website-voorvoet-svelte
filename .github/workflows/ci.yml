name: CI

# Runs on every push to main/dev and on every PR targeting them so
# lint/format/type/unit-test regressions surface before merge.
# Playwright + Lighthouse are kept in dependent jobs so they only run after
# `ci` succeeds and skip on draft PRs to keep iteration cycle short.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency — VERSION file is the source of truth
        run: pnpm run version:check

      - name: Security lint — no $env/static/private or $env/dynamic/private outside server modules
        run: |
          # Fail if any non-server file imports from $env/*/private.
          # Allowed paths: src/lib/server/**, src/**/*.server.ts, src/**/+server.ts,
          # src/hooks.server.ts, src/**/__tests__/**
          bad=$(grep -rn --include="*.ts" --include="*.svelte" \
            'env/dynamic/private\|env/static/private' src/ \
            | grep -v '/server/' \
            | grep -v '\.server\.ts' \
            | grep -v '+server\.ts' \
            | grep -v 'hooks\.server\.ts' \
            | grep -v '/__tests__/' \
            || true)
          if [ -n "$bad" ]; then
            echo "ERROR: private env imported outside server context:"
            echo "$bad"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

  playwright:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # Pre-existing failures on the GitHub runner that were never caught
    # because CI used to be workflow_dispatch-only (see audit P4-E2).
    # Marking the job non-blocking so PRs aren't held hostage to a
    # latent failure; fix and remove continue-on-error in a follow-up.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app for E2E
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium-desktop
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (perf, a11y, SEO)
    runs-on: ubuntu-latest
    needs: ci
    # See playwright job comment. Lighthouse currently errors with
    # ERRORED_DOCUMENT_REQUEST on the GitHub runner — likely a preview-
    # server / CAP env issue that doesn't reproduce locally. Non-blocking
    # until investigated.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for preview
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lighthouse
        env:
          # Soft-launch: assertions are 'warn' in lighthouse/lighthouserc.cjs. Flip to
          # 'error' once we have CI-runner score baselines.
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
